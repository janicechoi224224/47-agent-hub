<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>代理知识库一本通｜可视化导航</title>
  <style>
  :root{
    --ink:#17324d; --muted:#5f7894; --sky:#4aa8ff; --sky-deep:#147bd1; --sky-soft:#eaf6ff;
    --card:rgba(255,255,255,.86); --line:rgba(70,145,210,.18); --shadow:0 24px 70px rgba(46,118,187,.16);
    --brand:#7c5cff; --effect:#17a673; --star:#ff6ba6; --cloud:#12a5c4; --common:#6b7a99;
    --new:#ff3b52;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;font-family:"Noto Sans SC",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(135deg,#f7fbff 0%,#edf8ff 42%,#fff 100%);min-height:100vh;overflow-x:hidden;}
  .inline-icon{display:inline-flex;align-items:center;justify-content:center;line-height:1;}
  .sky-orb{position:fixed;border-radius:999px;filter:blur(4px);pointer-events:none;z-index:-1;opacity:.72;}
  .sky-orb-a{width:440px;height:440px;background:radial-gradient(circle,rgba(88,186,255,.28),transparent 66%);top:-90px;right:-90px;}
  .sky-orb-b{width:380px;height:380px;background:radial-gradient(circle,rgba(153,219,255,.36),transparent 68%);bottom:8%;left:-110px;}

  .hero{padding:26px clamp(20px,5vw,72px) 30px;}
  .topbar,.hero-main,main,footer{max-width:1280px;margin:0 auto;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .brand-mark,.source-link{display:inline-flex;align-items:center;gap:10px;}
  .brand-mark{font-weight:800;letter-spacing:.02em;font-size:18px;}
  .brand-mark .inline-icon{color:var(--sky-deep);font-size:22px;}
  .source-link{color:var(--sky-deep);text-decoration:none;background:rgba(255,255,255,.72);border:1px solid var(--line);padding:10px 14px;border-radius:999px;box-shadow:0 10px 30px rgba(30,126,204,.08);transition:.25s ease;}
  .source-link:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(30,126,204,.14);}

  .hero-main{display:grid;grid-template-columns:minmax(0,1.35fr) 420px;gap:30px;align-items:center;padding-top:46px;}
  .eyebrow,.section-kicker{color:var(--sky-deep);font-weight:800;letter-spacing:.15em;font-size:12px;margin:0 0 12px;}
  h1{font-size:clamp(32px,4.6vw,60px);line-height:1.06;letter-spacing:-.04em;margin:0;max-width:880px;}
  .subtitle{color:var(--muted);font-size:17px;line-height:1.8;max-width:760px;margin:20px 0 0;}
  .contact-line{color:var(--sky-deep);font-size:15px;line-height:1.7;margin:10px 0 0;font-weight:700;}
  .hero-actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:28px;}
  .primary-btn{border:0;cursor:pointer;display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:14px 20px;font-weight:800;transition:.22s ease;color:#fff;background:linear-gradient(135deg,var(--sky),var(--sky-deep));box-shadow:0 18px 38px rgba(20,123,209,.26);}
  .primary-btn:hover{transform:translateY(-3px);}
  .summary-panel{background:var(--card);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.92);box-shadow:var(--shadow);border-radius:32px;padding:26px;position:relative;overflow:hidden;}
  .summary-panel:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at top right,rgba(74,168,255,.22),transparent 45%);}
  .summary-grid{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .summary-grid div{background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:22px;padding:16px 10px;text-align:center;}
  .summary-grid span{display:block;font-size:28px;font-weight:900;color:var(--sky-deep);}
  .summary-grid label{color:var(--muted);font-size:13px;}
  .freshness{position:relative;color:var(--muted);line-height:1.7;margin:16px 0 0;font-size:13px;}

  main{padding:0 clamp(20px,5vw,72px) 48px;}

  /* 本周上新 banner */
  .weekly{position:relative;margin:0 0 24px;border-radius:30px;padding:24px 26px;overflow:hidden;
    background:linear-gradient(120deg,#0f2a4a 0%,#123f74 55%,#155fa6 100%);color:#eaf4ff;box-shadow:0 26px 60px rgba(18,63,116,.32);}
  .weekly:before{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,120,140,.35),transparent 65%);top:-120px;right:-40px;}
  .weekly:after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(74,168,255,.4),transparent 65%);bottom:-140px;left:20%;}
  .weekly-head{position:relative;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
  .weekly-badge{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,#ff6b81,#ff3b52);color:#fff;font-weight:900;font-size:13px;padding:7px 13px;border-radius:999px;box-shadow:0 8px 20px rgba(255,59,82,.4);letter-spacing:.02em;}
  .weekly-head h2{margin:0;font-size:24px;color:#fff;letter-spacing:-.01em;}
  .weekly-sub{position:relative;color:rgba(224,240,255,.82);font-size:13.5px;margin:0 0 16px;line-height:1.6;}
  .weekly-track{position:relative;display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;}
  .weekly-track::-webkit-scrollbar{height:8px;}
  .weekly-track::-webkit-scrollbar-thumb{background:rgba(255,255,255,.28);border-radius:999px;}
  .weekly-card{scroll-snap-align:start;flex:0 0 300px;max-width:300px;cursor:pointer;background:rgba(255,255,255,.1);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.22);border-radius:20px;padding:16px 17px;transition:.2s ease;display:flex;flex-direction:column;gap:9px;}
  .weekly-card:hover{transform:translateY(-4px);background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.5);}
  .weekly-tag{align-self:flex-start;font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;color:#fff;letter-spacing:.02em;}
  .weekly-card h4{margin:0;font-size:15px;line-height:1.45;color:#fff;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .weekly-card p{margin:0;font-size:12.5px;line-height:1.6;color:rgba(224,240,255,.78);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .weekly-card .wk-open{margin-top:2px;font-size:12px;font-weight:800;color:#bfe0ff;}

  .control-card{background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.9);border-radius:30px;padding:24px;box-shadow:var(--shadow);margin-bottom:24px;}
  .control-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;}
  h2{margin:0;font-size:26px;letter-spacing:-.02em;}
  .tabs{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;}
  .tab-btn{border:1px solid var(--line);background:#fff;color:var(--muted);padding:11px 15px;border-radius:999px;cursor:pointer;font-weight:700;transition:.2s ease;display:inline-flex;align-items:center;gap:7px;}
  .tab-btn.active,.tab-btn:hover{color:#fff;background:linear-gradient(135deg,var(--sky),var(--sky-deep));transform:translateY(-2px);box-shadow:0 12px 22px rgba(20,123,209,.18);}
  .tab-new{border-color:rgba(255,59,82,.45);box-shadow:0 8px 20px rgba(255,59,82,.14);}
  .tab-new.active,.tab-new:hover{background:linear-gradient(135deg,#ff6b81,#ff3b52);box-shadow:0 12px 24px rgba(255,59,82,.34);}
  .new-flag{background:var(--new);color:#fff;font-size:10.5px;font-weight:900;padding:3px 7px;border-radius:6px;letter-spacing:.04em;box-shadow:0 3px 8px rgba(255,59,82,.4);animation:blink 1.6s ease-in-out infinite;}
  .tab-new.active .new-flag,.tab-new:hover .new-flag{background:#fff;color:var(--new);}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.55;}}

  .content-area{display:grid;gap:22px;}
  .sticky-filter-bar{position:sticky;top:12px;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(20px);border:1px solid rgba(74,168,255,.28);border-radius:22px;padding:14px 18px;box-shadow:0 14px 34px rgba(30,126,204,.14);}
  .filter-inner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;}
  .filter-title{display:inline-flex;align-items:center;gap:10px;color:var(--sky-deep);font-weight:800;font-size:15px;white-space:nowrap;}
  .filter-title .inline-icon{font-size:20px;}
  .filter-scope{color:var(--ink);}
  .filter-count{background:var(--sky-soft);color:var(--sky-deep);padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;}
  .filter-controls{display:flex;align-items:center;gap:10px;flex:1 1 620px;justify-content:flex-end;flex-wrap:wrap;}
  .filter-search{display:flex;align-items:center;gap:9px;flex:1 1 260px;min-width:220px;background:#f6fbff;border:1px solid var(--line);border-radius:14px;padding:10px 13px;transition:.2s ease;}
  .filter-search:focus-within{border-color:var(--sky);box-shadow:0 0 0 4px rgba(74,168,255,.16);background:#fff;}
  .filter-search .inline-icon{color:var(--sky-deep);}
  .filter-search input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font-size:15px;font-family:inherit;}
  .select-box{display:flex;align-items:center;gap:8px;min-width:170px;background:#f6fbff;border:1px solid var(--line);border-radius:14px;padding:10px 13px;}
  .select-box .inline-icon{color:var(--sky-deep);}
  .select-box select{width:100%;outline:none;border:0;background:transparent;color:var(--ink);font-size:14px;font-family:inherit;cursor:pointer;}
  .clear-btn{border:0;cursor:pointer;background:linear-gradient(135deg,var(--sky),var(--sky-deep));color:#fff;border-radius:10px;padding:6px 12px;font-weight:800;font-size:12px;}
  .clear-btn:hover{transform:translateY(-1px);}

  .sheet-hero{background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow);border-radius:28px;padding:22px 24px;}
  .sheet-hero h2{margin-bottom:10px;}
  .sheet-meta{color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;font-size:14px;}

  .category-block{background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:26px;padding:20px;}
  .category-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  .category-head .cat-left{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .category-head h3{margin:0;font-size:19px;}
  .major-chip{font-size:12px;font-weight:800;color:#fff;padding:4px 10px;border-radius:999px;}
  .pill{display:inline-flex;align-items:center;padding:7px 11px;border-radius:999px;color:var(--sky-deep);background:var(--sky-soft);font-size:13px;font-weight:800;}
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
  .resource-card{min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;background:linear-gradient(180deg,#fff 0%,#f8fcff 100%);border:1px solid rgba(62,150,225,.16);border-radius:22px;padding:18px;cursor:pointer;color:var(--ink);transition:.22s ease;position:relative;overflow:hidden;}
  .resource-card:after{content:"";position:absolute;right:-34px;top:-34px;width:92px;height:92px;border-radius:50%;background:rgba(74,168,255,.12);transition:.22s ease;}
  .resource-card:hover{transform:translateY(-5px);box-shadow:0 18px 40px rgba(34,117,188,.14);border-color:rgba(74,168,255,.38);}
  .resource-card:hover:after{transform:scale(1.25);}
  .rc-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;position:relative;}
  .rc-dot{width:9px;height:9px;border-radius:50%;}
  .rc-major{font-size:11.5px;font-weight:800;color:var(--muted);}
  .rc-newflag{margin-left:auto;background:var(--new);color:#fff;font-size:10px;font-weight:900;padding:2px 6px;border-radius:5px;}
  .resource-title{font-weight:800;line-height:1.45;position:relative;}
  .resource-note{color:var(--muted);font-size:13px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;position:relative;}
  .resource-foot{display:flex;justify-content:space-between;align-items:center;color:var(--sky-deep);font-weight:800;font-size:13px;position:relative;}
  .empty-state{padding:40px;text-align:center;color:var(--muted);background:rgba(255,255,255,.76);border-radius:26px;border:1px dashed var(--line);}

  /* Drawer / side panel */
  .drawer-overlay{position:fixed;inset:0;background:rgba(16,40,66,.42);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:.28s ease;z-index:80;}
  .drawer-overlay.open{opacity:1;visibility:visible;}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:min(480px,94vw);background:#fff;box-shadow:-24px 0 70px rgba(16,40,66,.28);transform:translateX(102%);transition:transform .32s cubic-bezier(.22,.61,.36,1);z-index:90;display:flex;flex-direction:column;}
  .drawer.open{transform:translateX(0);}
  .drawer-hero{position:relative;padding:26px 26px 22px;color:#fff;overflow:hidden;flex:0 0 auto;}
  .drawer-hero:before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.16);top:-90px;right:-60px;}
  .drawer-emoji{font-size:44px;line-height:1;position:relative;}
  .drawer-tags{position:relative;display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 12px;}
  .drawer-tag{background:rgba(255,255,255,.22);color:#fff;font-size:12px;font-weight:800;padding:5px 11px;border-radius:999px;}
  .drawer-tag.solidnew{background:var(--new);box-shadow:0 4px 12px rgba(255,59,82,.4);}
  .drawer-hero h3{position:relative;margin:0;font-size:22px;line-height:1.4;}
  .drawer-close{position:absolute;top:18px;right:18px;z-index:2;width:36px;height:36px;border-radius:50%;border:0;cursor:pointer;background:rgba(255,255,255,.25);color:#fff;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:.2s ease;}
  .drawer-close:hover{background:rgba(255,255,255,.45);transform:rotate(90deg);}
  .drawer-body{padding:22px 26px 26px;overflow-y:auto;flex:1 1 auto;}
  .drawer-section-title{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--sky-deep);margin:0 0 10px;}
  .drawer-desc{color:var(--ink);font-size:15px;line-height:1.9;margin:0 0 22px;}
  .drawer-meta{display:flex;flex-direction:column;gap:12px;margin:0 0 24px;}
  .drawer-meta-row{display:flex;gap:12px;font-size:14px;line-height:1.6;}
  .drawer-meta-row .k{flex:0 0 74px;color:var(--muted);font-weight:700;}
  .drawer-meta-row .v{color:var(--ink);}
  .drawer-note{background:#fff7ec;border:1px solid #ffe0b8;border-radius:16px;padding:14px 16px;color:#8a5a1a;font-size:13.5px;line-height:1.7;margin:0 0 22px;}
  .drawer-open-btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;text-decoration:none;color:#fff;font-weight:800;font-size:16px;padding:15px;border-radius:16px;background:linear-gradient(135deg,var(--sky),var(--sky-deep));box-shadow:0 16px 34px rgba(20,123,209,.28);transition:.2s ease;}
  .drawer-open-btn:hover{transform:translateY(-2px);box-shadow:0 20px 40px rgba(20,123,209,.36);}
  .drawer-hint{text-align:center;color:var(--muted);font-size:12px;margin:12px 0 0;}

  footer{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;color:var(--muted);border-top:1px solid var(--line);padding:24px 0 8px;font-size:13px;}

  @media (max-width:920px){.hero-main{grid-template-columns:1fr;padding-top:36px;}.summary-panel{max-width:560px;}}
  @media (max-width:640px){.summary-grid{grid-template-columns:1fr;}.control-card,.sheet-hero,.category-block,.weekly{border-radius:22px;padding:18px;}.card-grid{grid-template-columns:1fr;}.filter-controls{width:100%;justify-content:flex-start;}.weekly-card{flex-basis:82vw;max-width:82vw;}}
  </style>
</head>
<body>
  <div class="sky-orb sky-orb-a"></div>
  <div class="sky-orb sky-orb-b"></div>

  <header class="hero">
    <nav class="topbar">
      <div class="brand-mark">
        <span class="inline-icon" aria-hidden="true">📚</span>
        <span>代理知识库一本通</span>
      </div>
      <a id="sourceLink" class="source-link" target="_blank" rel="noopener">
        <span class="inline-icon" aria-hidden="true">📋</span>
        飞书源表
      </a>
    </nav>

    <section class="hero-main">
      <div>
        <p class="eyebrow">AUTO PARTNER RESOURCE PLATFORM</p>
        <h1>汽车代理一本通 - 链接字节平台和代理的资料共享平台</h1>
        <p class="subtitle">本平台由 AIME 制作产出</p>
        <p class="contact-line">有任何疑问请咨询 @ 蔡思淇 (szekeichoi@bytedance.com)</p>
        <div class="hero-actions">
          <button id="scrollToTabs" class="primary-btn"><span class="inline-icon" aria-hidden="true">🧩</span>查看全部模块</button>
        </div>
      </div>
      <aside class="summary-panel">
        <div class="summary-grid">
          <div><span id="sheetCount">-</span><label>TAB 数</label></div>
          <div><span id="linkCount">-</span><label>资料按钮</label></div>
          <div><span id="newCount">-</span><label>本周上新</label></div>
        </div>
        <p id="freshnessText" class="freshness"></p>
      </aside>
    </section>
  </header>

  <main>
    <section id="weeklySection"></section>

    <section class="control-card" id="knowledgeTabs">
      <div class="control-head">
        <div>
          <p class="section-kicker">TAB & SEARCH</p>
          <h2>按业务专区浏览</h2>
        </div>
      </div>
      <div id="tabs" class="tabs"></div>
    </section>

    <section id="contentArea" class="content-area"></section>
  </main>

  <footer>
    <span>数据源：飞书表格「代理知识库一本通（均可对外）」</span>
    <span id="footerNote"></span>
  </footer>

  <div class="drawer-overlay" id="drawerOverlay"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-hero" id="drawerHero">
      <button class="drawer-close" id="drawerClose" aria-label="关闭">&times;</button>
      <div class="drawer-emoji" id="drawerEmoji"></div>
      <div class="drawer-tags" id="drawerTags"></div>
      <h3 id="drawerTitle"></h3>
    </div>
    <div class="drawer-body">
      <p class="drawer-section-title">核心内容速览</p>
      <p class="drawer-desc" id="drawerDesc"></p>
      <div class="drawer-meta" id="drawerMeta"></div>
      <div id="drawerNoteWrap"></div>
      <a class="drawer-open-btn" id="drawerOpen" target="_blank" rel="noopener"><span class="inline-icon" aria-hidden="true">↗</span>打开原文资料</a>
      <p class="drawer-hint">链接已按对外直开口径清洗临时参数，点击将在新标签页打开。</p>
    </div>

核心作用与投放路径。"}]};
  </script>
  <script>
  const DATA = window.__KB_DATA__;
  const MAJOR_THEME = {
    '品牌': { color:'#7c5cff', emoji:'🎬' },
    '效果': { color:'#17a673', emoji:'📈' },
    '星图': { color:'#ff6ba6', emoji:'⭐' },
    '云图': { color:'#12a5c4', emoji:'☁️' },
    '通用': { color:'#6b7a99', emoji:'🧰' },
  };
  const themeOf = (m) => MAJOR_THEME[m] || MAJOR_THEME['通用'];

  const state = { activeTab:'all', major:'', sub:'', query:'' };

  const $ = (id) => document.getElementById(id);
  const escapeHtml = (s='') => String(s).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));

  function cleanTab(name){ return name.replace(/（.*?）/g,'').replace(/[❗️]/g,'').trim(); }

  /* ---------- header ---------- */
  function renderHeader(){
    $('sourceLink').href = DATA.metadata.source_url;
    $('sheetCount').textContent = DATA.metadata.sheet_count;
    $('linkCount').textContent = DATA.metadata.total_links;
    $('newCount').textContent = DATA.newItems.length;
    $('freshnessText').textContent = `数据更新于 ${DATA.metadata.generated_at}，共 ${DATA.metadata.total_links} 份对外资料，覆盖 ${DATA.metadata.sheet_count} 个业务专区；本周新增 ${DATA.newItems.length} 份。`;
    $('footerNote').textContent = `本周上新基于源表 ${DATA.metadata.week_start} 至 ${DATA.metadata.generated_at} 的新增记录，随每日自动巡检 T+1 更新。`;
  }

  /* ---------- 本周上新 banner ---------- */
  function renderWeekly(){
    const list = DATA.newItems;
    if(!list.length){ $('weeklySection').innerHTML=''; return; }
    const cards = list.map(it => {
      const th = themeOf(it.major);
      const idx = DATA.items.findIndex(x => x.url===it.url && x.title===it.title);
      const short = it.desc.split('。').slice(0,2).join('。') + '。';
      return `<div class="weekly-card" data-idx="${idx}">
        <span class="weekly-tag" style="background:${th.color}">${th.emoji} ${escapeHtml(it.major)}</span>
        <h4>${escapeHtml(it.title)}</h4>
        <p>${escapeHtml(short)}</p>
        <span class="wk-open">点击查看内容速览 →</span>
      </div>`;
    }).join('');
    $('weeklySection').innerHTML = `
      <section class="weekly">
        <div class="weekly-head">
          <span class="weekly-badge">🔥 本周上新</span>
          <h2>本周新增速览</h2>
        </div>
        <p class="weekly-sub">统计区间 ${DATA.metadata.week_start} ~ ${DATA.metadata.generated_at}（近 7 天）· 共 ${list.length} 份新资料 · 随每日自动巡检 T+1 更新</p>
        <div class="weekly-track">${cards}</div>
      </section>`;
    $('weeklySection').querySelectorAll('.weekly-card').forEach(c=>{
      c.addEventListener('click', ()=> openDrawer(parseInt(c.dataset.idx,10)));
    });
  }

  /* ---------- tabs ---------- */
  function renderTabs(){
    const tabsData = DATA.tabs.slice();
    const newTabIndex = tabsData.findIndex(t=>t.name==='新产品专区');
    let newTab=null;
    if(newTabIndex>=0){ newTab=tabsData.splice(newTabIndex,1)[0]; }
    const allTab = { name:'all', label:'全部资料', count:DATA.metadata.total_links };
    const ordered=[];
    if(newTab) ordered.push({...newTab, isNew:true});
    ordered.push(allTab);
    ordered.push(...tabsData);
    $('tabs').innerHTML = ordered.map(t=>{
      const active = state.activeTab===t.name ? 'active':'';
      const newCls = t.isNew ? 'tab-new':'';
      const flag = t.isNew ? `<span class="new-flag">NEW!</span>`:'';
      return `<button class="tab-btn ${newCls} ${active}" data-tab="${escapeHtml(t.name)}">${flag}${escapeHtml(t.label)} · ${t.count}</button>`;
    }).join('');
    $('tabs').querySelectorAll('.tab-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        state.activeTab=btn.dataset.tab; state.major=''; state.sub=''; state.query='';
        renderTabs(); renderContent();
      });
    });
  }

  /* ---------- filtering ---------- */
  function scopeItems(){ return DATA.items.filter(it=> state.activeTab==='all' || it.sheet===state.activeTab); }
  function computeItems(){
    let list = scopeItems();
    if(state.major) list=list.filter(it=>it.major===state.major);
    if(state.sub) list=list.filter(it=>it.sub===state.sub);
    if(state.query){ const q=state.query.toLowerCase();
      list=list.filter(it=> (`${it.title} ${it.category} ${it.note} ${it.sheet} ${it.desc} ${it.major} ${it.sub}`).toLowerCase().includes(q)); }
    return list;
  }
  function availableMajors(){
    const scope=scopeItems(); const set=new Set(scope.map(i=>i.major));
    return DATA.majorOrder.filter(m=>set.has(m));
  }
  function availableSubs(){
    let scope=scopeItems();
    if(state.major) scope=scope.filter(i=>i.major===state.major);
    return [...new Set(scope.map(i=>i.sub))].sort((a,b)=>a.localeCompare(b,'zh-CN'));
  }

  /* ---------- content ---------- */
  function renderContent(){
    if(state.major && !availableMajors().includes(state.major)) state.major='';
    if(state.sub && !availableSubs().includes(state.sub)) state.sub='';
    const items=computeItems();
    const tabTotal=scopeItems().length;
    const title = state.activeTab==='all' ? '全部资料' : cleanTab(state.activeTab);
    const scopeLabel = state.activeTab==='all' ? '全部 TAB' : `${cleanTab(state.activeTab)} · 当前 TAB`;
    const majorOpts = [`<option value="">全部大类</option>`].concat(
      availableMajors().map(m=>`<option value="${escapeHtml(m)}" ${state.major===m?'selected':''}>${themeOf(m).emoji} ${escapeHtml(m)}</option>`)).join('');
    const subOpts = [`<option value="">全部子分类</option>`].concat(
      availableSubs().map(s=>`<option value="${escapeHtml(s)}" ${state.sub===s?'selected':''}>${escapeHtml(s)}</option>`)).join('');

    $('contentArea').innerHTML = `
      <div class="sticky-filter-bar">
        <div class="filter-inner">
          <div class="filter-title">
            <span class="inline-icon" aria-hidden="true">🔎</span>
            <span class="filter-scope">${escapeHtml(scopeLabel)}</span>
            <span class="filter-count">${items.length} / ${tabTotal}</span>
          </div>
          <div class="filter-controls">
            <div class="select-box"><span class="inline-icon" aria-hidden="true">🗂️</span>
              <select id="majorSelect">${majorOpts}</select></div>
            <div class="select-box"><span class="inline-icon" aria-hidden="true">🏷️</span>
              <select id="subSelect">${subOpts}</select></div>
            <div class="filter-search"><span class="inline-icon" aria-hidden="true">🔎</span>
              <input id="searchInput" type="search" placeholder="搜索标题 / 分类 / 内容…" value="${escapeHtml(state.query)}" autocomplete="off" />
              <button id="clearBtn" class="clear-btn" style="${state.query?'':'display:none;'}">清除</button></div>
          </div>
        </div>
      </div>
      <section class="sheet-hero">
        <p class="section-kicker">${state.activeTab==='all'?'ALL RESOURCES':'CURRENT TAB'}</p>
        <h2>${escapeHtml(title)}</h2>
        <div class="sheet-meta">
          <span>大类（品牌 / 效果 / 星图 / 云图 / 通用）+ 子分类 + 搜索三重联动筛选。</span>
          <span>点击任意卡片，右侧速览文档核心内容，再决定是否打开原文。</span>
        </div>
      </section>
      <div id="listContainer">${renderList(items)}</div>`;

    $('majorSelect').addEventListener('change', e=>{ state.major=e.target.value; state.sub=''; renderContent(); });
    $('subSelect').addEventListener('change', e=>{ state.sub=e.target.value; renderContent(); });
    const si=$('searchInput'), cb=$('clearBtn');
    si.addEventListener('input', e=>{ state.query=e.target.value.trim(); refreshList(); });
    cb.addEventListener('click', ()=>{ state.query=''; si.value=''; refreshList(); si.focus(); });
  }

  function refreshList(){
    const items=computeItems();
    const tabTotal=scopeItems().length;
    const lc=$('listContainer'); if(lc) lc.innerHTML=renderList(items);
    const fc=document.querySelector('.filter-count'); if(fc) fc.textContent=`${items.length} / ${tabTotal}`;
    const cb=$('clearBtn'); if(cb) cb.style.display=state.query?'':'none';
  }

  function renderList(items){
    if(!items.length) return `<div class="empty-state">没有找到匹配资料，换个关键词或筛选条件试试。</div>`;
    const groups={};
    items.forEach(it=>{ const k=it.major+'|'+it.sub; (groups[k]=groups[k]||[]).push(it); });
    const keys=Object.keys(groups).sort((a,b)=>{
      const ma=a.split('|')[0], mb=b.split('|')[0];
      const d=DATA.majorOrder.indexOf(ma)-DATA.majorOrder.indexOf(mb);
      return d!==0?d:a.localeCompare(b,'zh-CN');
    });
    return keys.map(k=>{
      const list=groups[k]; const [maj,sub]=k.split('|'); const th=themeOf(maj);
      return `<section class="category-block">
        <div class="category-head">
          <div class="cat-left">
            <span class="major-chip" style="background:${th.color}">${th.emoji} ${escapeHtml(maj)}</span>
            <h3>${escapeHtml(sub)}</h3>
          </div>
          <span class="pill">${list.length} 个入口</span>
        </div>
        <div class="card-grid">${list.map(renderCard).join('')}</div>
      </section>`;
    }).join('');
  }

  function renderCard(it){
    const th=themeOf(it.major); const idx=DATA.items.indexOf(it);
    const newFlag = it.isNew ? `<span class="rc-newflag">NEW</span>`:'';
    return `<div class="resource-card" data-idx="${idx}">
      <div class="rc-top">
        <span class="rc-dot" style="background:${th.color}"></span>
        <span class="rc-major">${th.emoji} ${escapeHtml(it.major)} · ${escapeHtml(it.sub)}</span>
        ${newFlag}
      </div>
      <div class="resource-title">${escapeHtml(it.title)}</div>
      <p class="resource-note">${escapeHtml(it.desc.split('。')[0])}。</p>
      <div class="resource-foot">
        <span>${escapeHtml(cleanTab(it.sheet))}</span>
        <span>速览 <span class="inline-icon" aria-hidden="true">↗</span></span>
      </div>
    </div>`;
  }

  $('contentArea').addEventListener('click', e=>{
    const card=e.target.closest('.resource-card'); if(card) openDrawer(parseInt(card.dataset.idx,10));
  });

  /* ---------- drawer ---------- */
  function openDrawer(idx){
    const it=DATA.items[idx]; if(!it) return; const th=themeOf(it.major);
    $('drawerHero').style.background = `linear-gradient(135deg, ${th.color}, ${shade(th.color,-24)})`;
    $('drawerEmoji').textContent = th.emoji;
    const tags=[`<span class="drawer-tag">${it.major}</span>`,`<span class="drawer-tag">${escapeHtml(it.sub)}</span>`];
    if(it.isNew) tags.unshift(`<span class="drawer-tag solidnew">🔥 本周上新</span>`);
    $('drawerTags').innerHTML=tags.join('');
    $('drawerTitle').textContent=it.title;
    $('drawerDesc').textContent=it.desc;
    $('drawerMeta').innerHTML=`
      <div class="drawer-meta-row"><span class="k">所属专区</span><span class="v">${escapeHtml(cleanTab(it.sheet))}</span></div>
      <div class="drawer-meta-row"><span class="k">分类路径</span><span class="v">${escapeHtml(it.major)} › ${escapeHtml(it.sub)}</span></div>
      <div class="drawer-meta-row"><span class="k">原始目录</span><span class="v">${escapeHtml(it.sheet==='新产品专区' ? '新产品专区（新品首发）' : (it.category||'—'))}</span></div>`;
    $('drawerNoteWrap').innerHTML = it.note ? `<div class="drawer-note">📌 备注：${escapeHtml(it.note)}</div>` : '';
    $('drawerOpen').href=it.url;
    $('drawerOpen').setAttribute('data-url', it.url);
    $('drawer').classList.add('open'); $('drawerOverlay').classList.add('open');
    $('drawer').setAttribute('aria-hidden','false'); document.body.style.overflow='hidden';
  }
  function closeDrawer(){
    $('drawer').classList.remove('open'); $('drawerOverlay').classList.remove('open');
    $('drawer').setAttribute('aria-hidden','true'); document.body.style.overflow='';
  }
  function shade(hex,pct){
    const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
    r=Math.max(0,Math.min(255,Math.round(r+(255*pct/100))));
    g=Math.max(0,Math.min(255,Math.round(g+(255*pct/100))));
    b=Math.max(0,Math.min(255,Math.round(b+(255*pct/100))));
    return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
  }
  $('drawerClose').addEventListener('click', closeDrawer);
  $('drawerOverlay').addEventListener('click', closeDrawer);
  $('drawerOpen').addEventListener('click', function(e){
    const u = this.getAttribute('data-url') || this.href;
    if(!u || u==='#' || u==='javascript:void(0)'){ e.preventDefault(); return; }
    e.preventDefault();
    try { window.open(u, '_blank', 'noopener,noreferrer'); }
    catch(err){ window.location.href = u; }
  });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDrawer(); });
  $('scrollToTabs').addEventListener('click', ()=> $('knowledgeTabs').scrollIntoView({behavior:'smooth'}));

  /* ---------- init ---------- */
  renderHeader(); renderWeekly(); renderTabs(); renderContent();
  </script>
</body>
</html>
